# opencode-stm example configuration. All active values shown are the built-in defaults.
# When this file is missing at plugin startup, opencode-stm creates it here from
# this template. Existing files are never overwritten; restart OpenCode after
# editing. The destination is $XDG_CONFIG_HOME/opencode/opencode-stm/config.yaml
# (or ~/.config/opencode/opencode-stm/config.yaml when XDG_CONFIG_HOME is unset
# or relative).
#
# Historical access is disabled by default. Enabling readTranscript sends selected
# historical content to the active model provider, and enabling any historical
# flag requires explicit user configuration plus the normal OpenCode permission
# policy. These flags do not grant authorisation by themselves.
review:
  enabled: true
  intervalMessages: 20
  maxReminders: 3
  backoffMultiplier: 2
  # Background title review is opt-in and discloses transcript data to the
  # selected agent's provider under normal OpenCode permissions. Uncomment this
  # block and set agent to an enabled OpenCode agent whose mode supports
  # subagent use; that agent's model and prompt are configured in OpenCode.
  # The transcript excludes tool calls and results unless explicitly enabled.
  # reviewer:
  #   agent: session-title-reviewer
  #   timeoutSeconds: 120
  #   transcript:
  #     includeToolCalls: false
  #     includeToolResults: false
  #     maxBytes: 131072
historical:
  readTitles: false
  renameTitles: false
  readTranscript: false
